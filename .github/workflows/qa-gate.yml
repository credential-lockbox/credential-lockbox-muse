name: QA Gate

# Posts a "QA Gate" commit status that is success only while the PR has the
# QA Approved label and the maintainer's account (MAINTAINER below) applied it
# last: the bots can label too, and their QA Approved counts for nothing.
# Adapted from credential-lockbox/credential-lockbox's qa-gate.yml.
#
# Limit: the QA sessions currently work under the maintainer's account, so this
# can't tell the maintainer's QA Approved from QA's. It enforces "a human-held
# account approved", not "the maintainer approved". Closing that needs QA to
# act under an identity of its own.
#
# This status is a signal, not the whole merge gate. Anything that can post a
# commit status can post "QA Gate": an installed app with statuses: write, or a
# pull_request-triggered workflow added on a PR's own branch (which runs that
# branch's YAML). Pin the required check to the GitHub Actions app in the
# ruleset to stop the first; the second stays possible for anyone who can push
# a branch here. The enforcement that doesn't rest on this file is main's
# ruleset: one approving review from an account with write access that didn't
# make the last push (dismissed when new commits are pushed).
#
# "QA Gate" (the status context) is meant to be a required check in main's
# ruleset: if it is renamed, update the ruleset, or every PR waits on a check
# that never comes.
#
# This repository has no label automation (no pr-labels.yml), so this workflow
# also does the one label job the gate needs: when a PR is opened, reopened or
# pushed to, it removes QA Approved, since that commit hasn't been approved. The
# maintainer applies it again after re-checking. A removal made with
# GITHUB_TOKEN doesn't trigger this workflow again; the run has already posted
# pending.
#
# Runs can be dropped: a concurrency group keeps one pending run, so a newer
# run cancels a queued one. Three checks stop a dropped run, or a failed label
# removal, from leaving a stale approval in force. Each status this workflow
# posts carries its PR number in target_url (?pr=N), so the checks read only
# this PR's statuses. (1) A head commit with no "QA Gate" status from this PR
# yet had its push run dropped: the label event does what that run would have
# done (pending, remove QA Approved) instead of approving. (2) An approval
# counts only if the maintainer's last QA Approved came after the head
# commit's first "QA Gate" status from this PR, so it was given while that
# commit was this PR's head. A plain push whose label removal failed is caught
# this way too. (3) It must also come after the PR's last force-push, reopen
# and base change (from the PR's events): a force-push back to an older commit
# keeps that commit's old statuses, so (2) alone can't catch it. A base change
# also runs this workflow at once (the edited event).
# What's left is within the limit above: anyone who can push a branch here can
# post a "QA Gate" status, with any target_url, directly.
#
# pull_request_target, not pull_request: it always runs this file as it is on
# main, so a PR's edits to it can't change its own gate. A change to this file
# takes effect only once it's on main. The trigger holds a write token even for
# a PR's code, so this job must never check out or run anything from the PR:
# it only reads the PR through the API, removes a label and posts a status, and
# every value from the event reaches the script through env:. (GitHub doesn't
# start pull_request_target for some branch names, such as ones that look like
# a SHA: such a PR gets no QA Gate, and waits.)
#
# Fork PRs are skipped (pull requests here are collaborators-only); the
# maintainer handles one by hand. The job is named post-qa-gate-status, not
# after the label: it is always green itself, and its name would read like an
# approval next to a pending QA Gate.
on:
  pull_request_target:
    branches: [main]
    # edited: only a base change matters (the script ignores title or body edits).
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  statuses: write
  # Remove QA Approved, and read the PR's label events (who applied it).
  pull-requests: write

# One run at a time per PR. A newer run can cancel a queued one (see the
# header): the script doesn't rely on every run happening.
concurrency:
  group: qa-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  post-qa-gate-status:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Set QA status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAINTAINER: cmeans
        run: |
          set -euo pipefail
          PENDING="Waiting for QA — add 'QA Approved' label when testing is complete"
          case "$PR" in ''|*[!0-9]*) echo "unexpected PR number: '$PR'"; exit 1 ;; esac
          # Every status this PR's runs post ends with this, so the checks
          # below can tell them from statuses posted for another PR.
          MARK="?pr=$PR"
          post() {
            gh api "repos/$REPO/statuses/$EVENT_SHA" --method POST \
              -f state="$1" -f description="$2" -f context="QA Gate" \
              -f target_url="$RUN_URL$MARK" > /dev/null
            echo "QA Gate: $1 on $EVENT_SHA"
          }
          # An ISO 8601 UTC time as the API gives it, or the job fails.
          is_time() {
            [[ "$1" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          }

          # A head commit nobody has approved yet: post pending, then take off a
          # QA Approved left over from an earlier commit, so the label no longer
          # shows an approval this commit doesn't have.
          unapproved_head() {
            post pending "${1:-$PENDING}"
            # A 404 means the label isn't on the PR: nothing to remove.
            # Any other failure fails the job, so it shows.
            ERR=$(gh api "repos/$REPO/issues/$PR/labels/QA%20Approved" \
              --method DELETE 2>&1 >/dev/null) || {
              case "$ERR" in
                *"HTTP 404"*) echo "QA Approved not on the PR" ;;
                *) echo "$ERR" >&2; exit 1 ;;
              esac
            }
          }

          case "$ACTION" in
            opened|synchronize|reopened)
              unapproved_head
              exit 0
              ;;
            edited)
              if [ "$BASE_CHANGED" = true ]; then
                unapproved_head "QA Approved doesn't count: the PR was retargeted; re-apply it after review"
                exit 0
              fi
              # A title or body edit: decide the gate from the PR as it is
              # now, like a label event. This run may have replaced a queued
              # push run, so it must not do nothing.
              ;;
          esac

          # labeled / unlabeled / edited: decide from the PR as it is now, not the event payload.
          # A command substitution, not a process substitution: under set -e a
          # failed API call then fails the job, instead of reading as an empty
          # head and exiting green on the "stale event" path.
          OUT=$(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.head.sha, ([.labels[].name] | index("QA Approved") != null)] | @tsv')
          read -r HEAD APPROVED <<<"$OUT"
          [ -n "$HEAD" ] || { echo "no head SHA in the API reply"; exit 1; }
          if [ "$HEAD" != "$EVENT_SHA" ]; then
            echo "Stale event: $EVENT_SHA is no longer the head ($HEAD); not changing QA Gate"
            exit 0
          fi
          # When the head commit first got a "QA Gate" status from this PR: the
          # time it became this PR's head (its push, open or reopen run).
          # Statuses come newest first, so the last one listed is the oldest.
          # None at all means that run never happened (a dropped run): treat
          # the head as unapproved rather than trust a label from an earlier
          # commit. Captured whole first, so a failed API call fails the job.
          STAMPS=$(gh api --paginate "repos/$REPO/commits/$HEAD/statuses?per_page=100" \
            --jq ".[] | select(.context == \"QA Gate\" and ((.target_url // \"\") | endswith(\"$MARK\"))) | .created_at")
          FIRST=$(printf '%s\n' "$STAMPS" | sed -n '$p')
          if [ -z "$FIRST" ]; then
            echo "No QA Gate status from this PR on $HEAD yet: treating it as unapproved"
            unapproved_head "QA Approved doesn't count: this commit wasn't checked in; re-apply it after review"
            exit 0
          fi
          is_time "$FIRST" || { echo "unexpected status time: '$FIRST'"; exit 1; }
          if [ "$APPROVED" != "true" ]; then
            post pending "$PENDING"
            exit 0
          fi
          # The PR's events, oldest first: who applied QA Approved last and
          # when, and whether a force-push, reopen or base change came after
          # it. Captured whole first, so a failed API call fails the job
          # instead of reading as no one.
          EVENTS=$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | if .event == "labeled" and .label.name == "QA Approved" then "label \(.actor.login) \(.created_at)"
                       elif .event == "head_ref_force_pushed" or .event == "reopened" or .event == "base_ref_changed" then "reset - -"
                       else empty end')
          LAST=$(printf '%s\n' "$EVENTS" | sed -n '$p')
          if [ -z "$LAST" ]; then
            # The label is on the PR, but no labeled event is (yet) in the
            # events API: wait for the next event rather than approve.
            echo "QA Approved is on the PR but no labeled event was found; not approving"
            post pending "$PENDING"
            exit 0
          fi
          read -r KIND WHO WHEN <<<"$LAST"
          if [ "$KIND" = reset ]; then
            echo "A force-push, reopen or base change came after the last QA Approved; not approving"
            unapproved_head "QA Approved doesn't count: the PR was force-pushed, reopened or retargeted since; re-apply it after review"
          elif [ "$WHO" != "$MAINTAINER" ]; then
            echo "QA Approved was applied by '$WHO', not $MAINTAINER; not approving"
            post pending "QA Approved counts only when $MAINTAINER applies it"
          elif ! is_time "$WHEN"; then
            echo "unexpected label time: '$WHEN'"
            exit 1
          elif [[ ! "$WHEN" > "$FIRST" ]]; then
            # ISO 8601 UTC times sort as strings.
            echo "QA Approved ($WHEN) predates $HEAD's first QA Gate status ($FIRST); not approving"
            unapproved_head "QA Approved doesn't count: it was applied before this commit; re-apply it after review"
          else
            post success "QA testing completed"
          fi
